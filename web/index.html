<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/montserrat-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/montserrat-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/montserrat-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/montserrat-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/montserrat-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/montserrat-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/montserrat-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/montserrat-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  color-scheme:light;
  --bg:#FFFFFF; --fill:#F5F5F5; --line:#EEEEEE;
  --ink:#111111; --ink-2:#6B6B6B; --ink-3:#A6A6A6;
  --on:#111111; --on-ink:#FFFFFF;
  --warn:#C0392B; --miss:#E03E2F;
  --h0:#F2F2F2; --h1:#D9D9D9; --h2:#ADADAD; --h3:#6F6F6F; --h4:#111111;
  --f:"Montserrat",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 20px 56px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -20px;padding:14px 20px 12px}
.tabs{display:flex;gap:22px;margin-bottom:18px}
.tabs button{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:4px 0;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.datebar{display:flex;align-items:center;gap:6px}
.datebar .nav{width:40px;height:40px;display:grid;place-items:center;font-size:22px;font-weight:400;color:var(--ink-2);flex:none;border-radius:50%}
.datebar .nav:active{background:var(--fill)}
.datebar .nav:disabled{opacity:.25;cursor:default}
.dt{flex:1;min-width:0;text-align:center}
.dt h1{margin:0;font-weight:600;font-size:20px;letter-spacing:-.01em;text-wrap:balance}
.dt .hijri{font-size:12px;color:var(--ink-3);margin-top:2px}
.prog{margin-top:14px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:3px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.prog b{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.status{font-size:11.5px;line-height:16px;height:16px;color:var(--ink-3);margin-top:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.err{color:var(--warn)}

/* blocks */
.blocks{display:flex;flex-direction:column;gap:26px;margin-top:10px}
.bh{display:flex;align-items:center;gap:10px;padding:6px 0 10px;width:100%;text-align:left}
.bh .t{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bh h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bh .hint{font-size:12px;color:var(--ink-3)}
.bh .cnt{font-size:12.5px;color:var(--ink-3);font-weight:600}
.bh .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .2s;flex:none}
.block.open .bh .chev{transform:rotate(180deg)}
.block.full .bh .cnt{color:var(--ink)}
.all{font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 0;margin:-4px 0 6px;display:block}
.all:active{color:var(--ink)}
.body{border-top:1px solid var(--line)}

.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;text-align:left;border-bottom:1px solid var(--line);min-height:54px}
.row .lab{flex:1;min-width:0}
.row .n{font-weight:500;font-size:15px}
.row .note{font-size:12px;color:var(--ink-3);margin-top:1px}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid #D4D4D4;flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:12px;height:12px;opacity:0;transition:opacity .15s}
.chk path{stroke:var(--on-ink)}
button.row[aria-pressed="true"] .chk{background:var(--on);border-color:var(--on)}
button.row[aria-pressed="true"] .chk svg{opacity:1}
button.row[aria-pressed="true"] .n{color:var(--ink-3)}

.row.tri{gap:2px}
.row.tri .lab{text-align:left;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.mark{width:44px;height:44px;margin:-5px 0;display:grid;place-items:center;flex:none;border-radius:50%}
.mark svg{width:28px;height:28px;padding:7px;border-radius:50%;border:1.5px solid #D4D4D4;box-sizing:border-box;transition:background .15s,border-color .15s}
.mark path{stroke:#C4C4C4;transition:stroke .15s}
.mark.yes[aria-pressed="true"] svg{background:var(--on);border-color:var(--on)}
.mark.yes[aria-pressed="true"] path{stroke:#fff}
.mark.no[aria-pressed="true"] svg{background:var(--miss);border-color:var(--miss)}
.mark.no[aria-pressed="true"] path{stroke:#fff}
.row.done .n{color:var(--ink-3)}
.row.miss .n{color:var(--miss)}
.dots i.x{background:#F3C9C4}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:500;color:var(--ink-2);border:1.5px solid var(--line)}
.step button:active{background:var(--fill)}
.step output{min-width:58px;text-align:center;font-weight:600}
.step output.ok{color:var(--ink)}
.multi{flex-direction:column;align-items:stretch;gap:10px}
.multi .head{display:flex;align-items:center;gap:12px}
.multi .head .cnt{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{padding:9px 2px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);text-align:center}
.chip[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--on-ink)}

/* stats */
.wk{margin:14px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em}
.tile .k{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.card{margin-top:26px}
.card h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content}
.heat i{width:18px;height:18px;border-radius:4px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.fut{background:transparent}
.heat i.sel{outline:1.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hl-group{margin-top:18px}
.hl-group:first-of-type{margin-top:0}
.hl-group h4{margin:0 0 6px;font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hl{display:grid;grid-template-columns:minmax(0,1fr) auto 40px 36px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.hl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.dots{display:flex;gap:2px}
.dots i{width:7px;height:14px;border-radius:2px;background:var(--h0)}
.dots i.p{background:var(--h2)}.dots i.d{background:var(--h4)}
.hl .pc,.hl .sk{text-align:right;font-weight:600}
.hl .sk{color:var(--ink-2)}
.hl-head{font-size:11px;color:var(--ink-3);border-top:0;padding-top:0}
.hl-head span{text-align:right}
.foot{font-size:11.5px;color:var(--ink-3);margin-top:22px;line-height:1.5}
button,textarea{touch-action:manipulation}
.dt h1{cursor:pointer}
.note-block{display:flex;flex-direction:column;gap:8px}
.note-lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.note-block textarea{font:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;min-height:52px;background:var(--bg)}
.note-block textarea:focus{outline:none;border-color:var(--ink)}
.note-block textarea::placeholder{color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:18px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.18);white-space:nowrap}
.toast button{font-weight:700;color:#fff;text-decoration:underline;text-underline-offset:3px}
.dl{font-size:11px;font-weight:600;color:var(--ink-3);margin-top:4px}
.dl.up{color:#1E7F4F}.dl.down{color:var(--warn)}
.weak{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:500}
.weak .blk{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:4px}
.weak b{font-weight:600}
@media (max-width:380px){.dots i{width:5px}.tile .v{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="tabs" role="tablist">
      <button id="tab-day" role="tab" aria-selected="true">День</button>
      <button id="tab-stats" role="tab" aria-selected="false">Статистика</button>
    </div>
    <div class="datebar" id="datebar">
      <button class="nav" id="prev" aria-label="Предыдущий день">‹</button>
      <div class="dt">
        <h1 id="dtitle" title="К сегодняшнему дню">—</h1>
        <div class="hijri" id="hijri"></div>
      </div>
      <button class="nav" id="next" aria-label="Следующий день">›</button>
    </div>
    <div class="prog" id="progrow">
      <div class="bar"><i id="barfill" style="width:0"></i></div>
      <b class="num" id="progtxt">0 из 30</b>
    </div>
    <div class="status" id="status">Загружаю отметки…</div>
  </div>

  <main id="view-day" class="blocks"></main>
  <main id="view-stats" hidden></main>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function(){
const CHECK='<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const MINUS='<svg viewBox="0 0 14 14"><path d="M3.5 7h7" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>';

const BLOCKS=[
 {id:'night',name:'Прошлая ночь',hint:'от Иша до Фаджра',items:[
  {id:'sleep_isha',n:'Сон после Иша'},
  {id:'tahajjud',n:'Подъём на тахаджуд'},
  {id:'witr',n:'Витр'},
  {id:'sleep_back',n:'Сон до подъёма на Фаджр'}]},
 {id:'dawn',name:'До Фаджра',hint:'подъём за час до азана',items:[
  {id:'wake_fajr',n:'Подъём на Фаджр',note:'за 1 час до азана'},
  {id:'am_squat',n:'Приседания',note:'15 раз'},
  {id:'am_push',n:'Отжимания',note:'15 раз'},
  {id:'am_abs',n:'Пресс',note:'30 раз'},
  {id:'am_back',n:'Поясница'},
  {id:'am_pull',n:'Подтягивания',note:'10 раз'},
  {id:'am_shower',n:'Душ'},
  {id:'am_minox',n:'Миноксидил'},
  {id:'am_vit',n:'Витамины'}]},
 {id:'morning',name:'Утро',hint:'после Фаджра',items:[
  {id:'fajr_masjid',n:'Фаджр в мечети'},
  {id:'am_azkar',n:'Азкары утра'},
  {id:'quran',n:'Коран',note:'5 страниц'},
  {id:'walk',n:'Прогулка',note:'30 минут'},
  {id:'duha',n:'Духа намаз'},
  {id:'breakfast',n:'Завтрак с семьёй',note:'или попутно'}]},
 {id:'day',name:'День',hint:'работа и намазы',items:[
  {id:'work',n:'Работа',note:'цель 4–5 часов',type:'hours',target:4,max:10},
  {id:'jamaat',n:'Намазы в джамаате',type:'multi',opts:['Зухр','Аср','Магриб','Иша']}]},
 {id:'evening',name:'Вечер',hint:'после Асра',items:[
  {id:'pm_azkar',n:'Азкары вечера'},
  {id:'pm_vit',n:'Витамины'},
  {id:'pm_squat',n:'Приседания',note:'15 раз'},
  {id:'pm_push',n:'Отжимания',note:'15 раз'},
  {id:'pm_abs',n:'Пресс',note:'30 раз'},
  {id:'pm_back',n:'Поясница'},
  {id:'pm_pull',n:'Подтягивания',note:'10 раз'},
  {id:'pm_shower',n:'Душ'},
  {id:'pm_minox',n:'Миноксидил'}]}
];
const ALL=BLOCKS.flatMap(b=>b.items.map(h=>Object.assign({block:b.id},h)));
const TOTAL=ALL.length;

function score(h,raw){
  if(h.type==='hours') return raw?Math.min(raw/h.target,1):0;
  if(h.type==='multi') return Array.isArray(raw)?raw.length/h.opts.length:0;
  return raw===true?1:0; // false = explicitly not done
}
function dayScore(v){v=v||{};let s=0;for(const h of ALL)s+=score(h,v[h.id]);return s;}

// dates
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d);};
let today=key(new Date());
let viewDate=today;
const fmtDay=new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'long'});
let fmtHijri=null;
try{fmtHijri=new Intl.DateTimeFormat('ru-RU-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'});}catch(e){}

// state
const state={}; // date -> values
const pending=new Set(); let timer=null;
const $=id=>document.getElementById(id);
let statusTimer=null;
function setStatus(t,err){
  const s=$('status');s.textContent=t;s.classList.toggle('err',!!err);
  clearTimeout(statusTimer);
  if(!err&&/^(Сохранено|Синхронизировано)$/.test(t))statusTimer=setTimeout(()=>{s.textContent='';},1500);
}
// Access key: open the site once as /?k=KEY, it is remembered on this device.
let KEY='';
try{
  const u=new URL(location.href);const k=u.searchParams.get('k');
  if(k){localStorage.setItem('fajr-witr-key',k);u.searchParams.delete('k');history.replaceState(null,'',u.pathname+u.search+u.hash);}
  KEY=localStorage.getItem('fajr-witr-key')||'';
}catch(e){}
function authMsg(){setStatus('Нужен ключ доступа: открой ссылку вида рахмат.рус/?k=КЛЮЧ один раз на этом устройстве',true);}

// Local copy keeps the page instant and survives a weak signal; the server is the shared copy.
let unsynced={};
try{unsynced=JSON.parse(localStorage.getItem('fajr-witr-unsynced')||'{}');}catch(e){}
function lsLoad(){try{const raw=localStorage.getItem('fajr-witr-days');if(raw)Object.assign(state,JSON.parse(raw));}catch(e){}}
function lsSave(){try{localStorage.setItem('fajr-witr-days',JSON.stringify(state));localStorage.setItem('fajr-witr-unsynced',JSON.stringify(unsynced));}catch(e){}}

// Every tap is written to the device first (survives closing the app, no signal, reboot),
// then sent to the server in the background until it gets through.
function mutate(date,fn){
  const v=state[date]||(state[date]={});
  fn(v);
  unsynced[date]=true;
  lsSave();
  render();
  clearTimeout(timer);
  timer=setTimeout(push,450);
}
function unsentCount(){return Object.keys(unsynced).length;}
function offlineMsg(){
  const n=unsentCount();
  setStatus(n?`Нет сети · сохранено на телефоне, отправлю позже (${n})`:'Нет сети · показываю сохранённое на телефоне',true);
}
function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Content-Type':'application/json','X-Key':KEY},opts.headers||{});
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000); // a dead network must not hang the queue
  opts.signal=ctl.signal;
  return fetch(path,opts).then(r=>{clearTimeout(t);if(r.status===401)throw {auth:true};if(!r.ok)throw new Error(r.status);return r.json();},e=>{clearTimeout(t);throw e;});
}
let pushing=false;
function push(){
  if(pushing)return;
  const d=Object.keys(unsynced).sort()[0];
  if(!d){setStatus('Сохранено');return;}
  pushing=true;setStatus('Сохраняю…');
  const v=state[d]||{};const s=dayScore(v);
  const sent=JSON.stringify(v);
  api('/api/days/'+d,{method:'PUT',body:JSON.stringify({v,score:Math.round(s*100)/100,pct:Math.round(s/TOTAL*100)})})
    .then(()=>{
      pushing=false;
      if(JSON.stringify(state[d]||{})===sent)delete unsynced[d]; // edited meanwhile — send again
      lsSave();push();
    })
    .catch(e=>{pushing=false;if(e&&e.auth)authMsg();else offlineMsg();});
}
function pull(){
  api('/api/days')
    .then(res=>{
      const all=res.days||{};
      for(const k in all)if(!unsynced[k]&&!pending.has(k))state[k]=all[k].v||{};
      // server lost a day this device still has (e.g. after a redeploy) — send it back
      for(const k in state)if(!all[k]&&Object.keys(state[k]||{}).length)unsynced[k]=true;
      lsSave();render();
      if(unsentCount())push();else setStatus('Синхронизировано');
    })
    .catch(e=>{if(e&&e.auth)authMsg();else offlineMsg();});
}
// retry as soon as the connection is back, and every 20 s while something is waiting
window.addEventListener('online',()=>{if(unsentCount())push();else pull();});
window.addEventListener('offline',()=>offlineMsg());
setInterval(()=>{if(unsentCount()&&!pushing)push();},20000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

// ---------- day view
function el(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const openState={};
let shownOpen=new Set(); // blocks open on screen right now
function renderDay(){
  const v=state[viewDate]||{};
  const root=$('view-day');root.innerHTML='';
  const nowOpen=new Set();
  for(const b of BLOCKS){
    let got=0;for(const h of b.items)got+=score(h,v[h.id]);
    const full=got>=b.items.length-1e-9;
    const ok=openState[viewDate+':'+b.id];
    const resolved=full||b.items.every(h=>!h.type&&v[h.id]!==undefined); // every item answered yes or no
    const k=viewDate+':'+b.id;
    const isOpen=ok!==undefined?ok:(!resolved||shownOpen.has(k)); // answered blocks fold on next open, not mid-tap
    if(isOpen)nowOpen.add(k);
    const sec=el('section',{class:'block'+(full?' full':'')+(isOpen?' open':'')});
    const bools=b.items.filter(h=>!h.type);
    const allOn=bools.length&&bools.every(h=>v[h.id]===true);
    const gotTxt=Number.isInteger(got)?got:got.toFixed(1).replace('.',',');
    const bh=el('button',{class:'bh','aria-expanded':String(isOpen)},`<div class="t"><h2>${esc(b.name)}</h2><span class="hint">${esc(b.hint)}</span></div><span class="cnt num">${full?'Готово':gotTxt+'/'+b.items.length}</span><svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
    bh.onclick=()=>{openState[viewDate+':'+b.id]=!isOpen;render();};
    sec.appendChild(bh);
    if(!isOpen){root.appendChild(sec);continue;}
    if(bools.length>1){
      const all=el('button',{class:'all'},allOn?'Снять всё':'Отметить всё');
      all.onclick=()=>{
        const date=viewDate,before={};for(const h of bools)before[h.id]=state[date]&&state[date][h.id];
        mutate(date,v=>{for(const h of bools){if(allOn)delete v[h.id];else v[h.id]=true;}});
        toast((allOn?'Снято: ':'Отмечено: ')+bools.length,()=>mutate(date,v=>{for(const id in before){if(before[id]!==undefined)v[id]=before[id];else delete v[id];}}));
      };
      sec.appendChild(all);
    }
    const body=el('div',{class:'body'});sec.appendChild(body);
    for(const h of b.items){
      const note=h.note?`<div class="note">${esc(h.note)}</div>`:'';
      if(!h.type){
        const st=v[h.id]===true?'done':v[h.id]===false?'miss':'';
        const r=el('div',{class:'row tri'+(st?' '+st:''),id:'h-'+h.id});
        const lab=el('button',{class:'lab'},`<div class="n">${esc(h.n)}</div>${note}`);
        const no=el('button',{class:'mark no','aria-pressed':String(st==='miss'),'aria-label':'Не сделал'},MINUS);
        const yes=el('button',{class:'mark yes','aria-pressed':String(st==='done'),'aria-label':'Сделал'},CHECK);
        const set=val=>mutate(viewDate,v=>{if(v[h.id]===val)delete v[h.id];else v[h.id]=val;});
        lab.onclick=()=>set(true);yes.onclick=()=>set(true);no.onclick=()=>set(false);
        r.append(lab,no,yes);body.appendChild(r);
      }else if(h.type==='hours'){
        const val=+v[h.id]||0;
        const r=el('div',{class:'row'},`<div class="lab"><div class="n">${esc(h.n)}</div>${note}</div>`);
        const st=el('div',{class:'step'});
        const minus=el('button',{'aria-label':'Меньше на полчаса'},'−');
        const out=el('output',{class:'num'+(val>=h.target?' ok':'')},(val?String(val).replace('.',','):'0')+' ч');
        const plus=el('button',{'aria-label':'Больше на полчаса'},'+');
        minus.onclick=()=>mutate(viewDate,v=>{const n=Math.max(0,(+v[h.id]||0)-0.5);if(n)v[h.id]=n;else delete v[h.id];});
        plus.onclick=()=>mutate(viewDate,v=>{v[h.id]=Math.min(h.max,(+v[h.id]||0)+0.5);});
        st.append(minus,out,plus);r.appendChild(st);body.appendChild(r);
      }else if(h.type==='multi'){
        const arr=Array.isArray(v[h.id])?v[h.id]:[];
        const r=el('div',{class:'row multi'});
        r.appendChild(el('div',{class:'head'},`<div class="lab"><div class="n">${esc(h.n)}</div></div><span class="cnt num">${arr.length}/${h.opts.length}</span>`));
        const ch=el('div',{class:'chips'});
        for(const o of h.opts){
          const on=arr.includes(o);
          const c=el('button',{class:'chip','aria-pressed':String(on)},esc(o));
          c.onclick=()=>mutate(viewDate,v=>{let a=Array.isArray(v[h.id])?v[h.id].slice():[];a=on?a.filter(x=>x!==o):h.opts.filter(x=>x===o||a.includes(x));if(a.length)v[h.id]=a;else delete v[h.id];});
          ch.appendChild(c);
        }
        r.appendChild(ch);body.appendChild(r);
      }
    }
    root.appendChild(sec);
  }
  shownOpen=nowOpen;
  const nb=el('section',{class:'note-block'},'<label class="note-lab" for="day-note">Заметка дня</label>');
  const ta=el('textarea',{id:'day-note',rows:'2',placeholder:'Что помешало или помогло — одной строкой'});
  ta.value=v._note||'';
  ta.oninput=()=>saveNote(viewDate,ta.value);
  nb.appendChild(ta);root.appendChild(nb);
}
let noteTimer=null;
function saveNote(date,text){
  const v=state[date]||(state[date]={});
  if(text.trim())v._note=text;else delete v._note;
  unsynced[date]=true;
  lsSave();
  clearTimeout(noteTimer);
  noteTimer=setTimeout(push,800);
}

function toast(text,undo){
  const t=$('toast');clearTimeout(t._h);
  t.innerHTML='';t.appendChild(el('span',null,esc(text)));
  if(undo){const b=el('button',null,'Отменить');b.onclick=()=>{t.hidden=true;undo();};t.appendChild(b);}
  t.hidden=false;t._h=setTimeout(()=>{t.hidden=true;},5000);
}

function renderHeader(){
  const d=parse(viewDate);
  let t=fmtDay.format(d);t=t.charAt(0).toUpperCase()+t.slice(1);
  $('dtitle').textContent=viewDate===today?'Сегодня, '+t.split(', ').slice(1).join(', '):t;
  $('hijri').textContent=fmtHijri?fmtHijri.format(d):'';
  $('next').disabled=viewDate>=today;
  const s=dayScore(state[viewDate]);
  $('barfill').style.width=(s/TOTAL*100).toFixed(1)+'%';
  const sTxt=Number.isInteger(s)?s:s.toFixed(1).replace('.',',');
  $('progtxt').textContent=s>=TOTAL-1e-9?'Всё выполнено':`${sTxt} из ${TOTAL} · ${Math.round(s/TOTAL*100)}%`;
}

// ---------- stats
function firstDate(){const ks=Object.keys(state).filter(k=>Object.keys(state[k]||{}).length).sort();return ks[0]||today;}
function streak(h){
  let d=today,n=0;
  if(score(h,(state[d]||{})[h.id])<1)d=addDays(d,-1);
  while(score(h,(state[d]||{})[h.id])>=1){n++;d=addDays(d,-1);}
  return n;
}
function pctWindow(h,days){
  const start=firstDate();let done=0,cnt=0;
  for(let i=0;i<days;i++){const d=addDays(today,-i);if(d<start)break;cnt++;done+=score(h,(state[d]||{})[h.id]);}
  return cnt?Math.round(done/cnt*100):0;
}
function avgPrev(fn){ // days 8..14 back; null when the log is younger than that
  const start=firstDate();if(addDays(today,-7)<start)return null;
  let s=0,c=0;for(let i=7;i<14;i++){const d=addDays(today,-i);if(d<start)break;c++;s+=fn(state[d]||{});}return c?s/c:null;
}
function avg(fn,days){const start=firstDate();let s=0,c=0;for(let i=0;i<days;i++){const d=addDays(today,-i);if(d<start)break;c++;s+=fn(state[d]||{});}return c?s/c:0;}
const fmt1=n=>n.toFixed(1).replace('.',',');

function renderStats(){
  const root=$('view-stats');root.innerHTML='';
  const dayPct=avg(v=>dayScore(v)/TOTAL,7)*100, dayPrev=avgPrev(v=>dayScore(v)/TOTAL)*100;
  const work=avg(v=>+v.work||0,7), workPrev=avgPrev(v=>+v.work||0);
  const jam=avg(v=>Array.isArray(v.jamaat)?v.jamaat.length:0,7), jamPrev=avgPrev(v=>Array.isArray(v.jamaat)?v.jamaat.length:0);
  const delta=(a,b,f,unit)=>{if(b===null)return '';const d=a-b;if(Math.abs(d)<0.05)return '<div class="dl">как на прошлой</div>';return `<div class="dl ${d>0?'up':'down'}">${d>0?'+':'−'}${f(Math.abs(d))}${unit} к прошлой</div>`;};
  root.appendChild(el('h3',{class:'wk'},'Последние 7 дней'));
  const tiles=el('div',{class:'tiles'});
  tiles.innerHTML=`<div class="tile"><div class="v num">${Math.round(dayPct)}%</div><div class="k">день в среднем</div>${delta(dayPct,dayPrev,x=>Math.round(x),' п.')}</div>
  <div class="tile"><div class="v num">${fmt1(work)} ч</div><div class="k">работа в день</div>${delta(work,workPrev,fmt1,' ч')}</div>
  <div class="tile"><div class="v num">${fmt1(jam)}/4</div><div class="k">джамаат в день</div>${delta(jam,jamPrev,fmt1,'')}</div>`;
  root.appendChild(tiles);

  // weak spots: lowest completion over the last 14 days
  const tracked=Object.keys(state).filter(k=>k>=addDays(today,-13)&&Object.keys(state[k]||{}).length).length;
  if(tracked>=3){
    const weak=ALL.map(h=>({h,p:pctWindow(h,14)})).filter(x=>x.p<80).sort((a,b)=>a.p-b.p).slice(0,3);
    const w=el('div',{class:'card'},'<h3>Слабые места · 14 дней</h3>');
    if(weak.length)for(const x of weak)w.appendChild(el('div',{class:'weak'},`<span>${esc(x.h.n)} <span class="blk">${esc(BLOCKS.find(b=>b.id===x.h.block).name.toLowerCase())}</span></span><b class="num">${x.p}%</b>`));
    else w.appendChild(el('div',{class:'weak'},'<span>Всё выше 80% — держится</span>'));
    root.appendChild(w);
  }

  // heatmap: 15 weeks, Mon-first columns
  const card=el('div',{class:'card'},'<h3>Последние 15 недель</h3>');
  const wrap=el('div',{class:'heat-wrap'});const grid=el('div',{class:'heat'});
  const t=parse(today);const dow=(t.getDay()+6)%7;
  let start=addDays(today,-(dow+7*14));
  for(let i=0;i<15*7;i++){
    const d=addDays(start,i);const c=el('i');
    if(d>today)c.className='fut';
    else{const v=state[d];if(v&&Object.keys(v).length){const p=dayScore(v)/TOTAL;c.className=p>=.9?'l4':p>=.7?'l3':p>=.4?'l2':'l1';}
      c.title=d;c.setAttribute('role','button');c.tabIndex=-1;
      c.onclick=()=>{viewDate=d;switchTab('day');};}
    if(d===viewDate)c.classList.add('sel');
    grid.appendChild(c);
  }
  wrap.appendChild(grid);card.appendChild(wrap);
  card.appendChild(el('div',{class:'legend'},'меньше <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> 90%+ · нажми день, чтобы открыть'));
  root.appendChild(card);

  // per habit
  const list=el('div',{class:'card'},'<h3>По привычкам</h3>');
  for(const b of BLOCKS){
    const g=el('div',{class:'hl-group'},`<h4>${esc(b.name)}</h4>`);
    g.appendChild(el('div',{class:'hl hl-head'},'<span style="text-align:left"></span><span>14 дней</span><span>30д</span><span>серия</span>'));
    for(const h of b.items){
      let dots='';
      for(let i=13;i>=0;i--){const d=addDays(today,-i);const s=score(h,(state[d]||{})[h.id]);const raw=(state[d]||{})[h.id];dots+=`<i class="${s>=1?'d':s>0?'p':raw===false?'x':''}"></i>`;}
      g.appendChild(el('div',{class:'hl'},`<span class="nm">${esc(h.n)}${h.note&&/раз|стр|мин/.test(h.note)?' <span style="color:var(--ink-3)">'+esc(h.note.replace(' раз',''))+'</span>':''}</span><span class="dots">${dots}</span><span class="pc num">${pctWindow(h,30)}%</span><span class="sk num">${streak(h)}</span>`));
    }
    list.appendChild(g);
  }
  root.appendChild(list);
  root.appendChild(el('div',{class:'foot'},'Серия — сколько дней подряд выполнено, считая сегодня или вчера. Проценты — с первого дня отметок. Свайп влево-вправо на экране дня листает дни, тап по дате — вернуться к сегодня.'));
}

let tab='day';
function switchTab(t){
  tab=t;
  $('tab-day').setAttribute('aria-selected',String(t==='day'));
  $('tab-stats').setAttribute('aria-selected',String(t==='stats'));
  $('view-day').hidden=t!=='day';$('view-stats').hidden=t!=='stats';
  $('datebar').hidden=t!=='day';$('progrow').hidden=t!=='day';
  try{localStorage.setItem('fajr-witr-tab',t);}catch(e){}
  render();window.scrollTo(0,0);
}
function render(){renderHeader();if(tab==='day')renderDay();else renderStats();}

function go(n){const d=addDays(viewDate,n);if(d>today)return;viewDate=d;render();}
$('prev').onclick=()=>go(-1);
$('dtitle').onclick=()=>{if(viewDate!==today){viewDate=today;render();}};
let tx=0,ty=0,tt=0;
$('view-day').addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();},{passive:true});
$('view-day').addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Date.now()-tt<600&&Math.abs(dx)>70&&Math.abs(dy)<40)go(dx>0?-1:1);
},{passive:true});
$('next').onclick=()=>go(1);
$('tab-day').onclick=()=>switchTab('day');
$('tab-stats').onclick=()=>switchTab('stats');
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'){lsSave();return;}
  const now=key(new Date());
  if(now!==today){if(viewDate===today)viewDate=now;today=now;render();}
  pull(); // pick up marks made on the other device
});

try{if(localStorage.getItem('fajr-witr-tab')==='stats')tab='stats';}catch(e){}
lsLoad();
switchTab(tab);
setStatus('Загружаю…');pull();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body>
