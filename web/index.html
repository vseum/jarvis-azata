:root{
  color-scheme:light;
  --bg:#FFFFFF; --fill:#F5F5F5; --line:#EEEEEE;
  --ink:#111111; --ink-2:#6B6B6B; --ink-3:#A6A6A6;
  --on:#111111; --on-ink:#FFFFFF;
  --warn:#C0392B; --miss:#E03E2F;
  --h0:#F2F2F2; --h1:#D9D9D9; --h2:#ADADAD; --h3:#6F6F6F; --h4:#111111;
  --f:"Montserrat",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 20px 56px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -20px;padding:10px 20px 10px}
.tabs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px;margin-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);padding:4px 0;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.datebar{display:flex;align-items:center;gap:6px}
.datebar .nav{width:34px;height:34px;display:grid;place-items:center;font-size:22px;font-weight:400;color:var(--ink-2);flex:none;border-radius:50%}
.datebar .nav:active{background:var(--fill)}
.datebar .nav:disabled{opacity:.25;cursor:default}
.dt{flex:1;min-width:0;text-align:center}
.dt h1{margin:0;font-weight:600;font-size:20px;letter-spacing:-.01em;text-wrap:balance}
.prog{margin-top:8px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:3px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.prog .pl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);width:74px;flex:none;text-align:left}
.prog.p2{margin-top:6px;width:100%;padding:0}
.prog.p2 .bar i{background:var(--ink-2)}
.from-week{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.fw-l{font-size:12px;color:var(--ink-3);width:100%}
.fw{font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1.5px dashed #CFCFCF;color:var(--ink-2);text-align:left}
.prog b{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
/* статус не занимает места в шапке: всплывает маленькой плашкой под ней */
.status{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);max-width:calc(100% - 40px);font-size:11.5px;line-height:16px;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.status:empty{display:none}
.status.err{color:var(--warn);border-color:#F1C7C1}

/* blocks */
.blocks{display:flex;flex-direction:column;gap:26px;margin-top:10px}
.word{margin-top:-14px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px}
.wlab{font-size:11.5px;color:var(--ink-3)}
.wmain{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:0}
.wtr b{display:block;font-size:15px;font-weight:600}
.wtr span{font-size:13px;color:var(--ink-2)}
.war{font-family:"KFGQPC Hafs","Geeza Pro",serif;font-size:32px;line-height:1.7;color:var(--ink)}
.wex{margin-top:2px;padding-top:4px;border-top:1px solid var(--line)}
.wexa{font-family:"KFGQPC Hafs","Geeza Pro",serif;font-size:25px;line-height:2.15;text-align:right}
[lang="ar"]{text-rendering:optimizeLegibility;font-variant-ligatures:normal;font-feature-settings:normal}
.wexr{font-size:12px;color:var(--ink-2);margin-top:0}
.hlw{color:#D93025}
.lx-er .hlw,.lx-note .hlw,.wexr .hlw,.lx-q .hlw,.ls-ru .hlw{font-weight:600}
.word{cursor:pointer}
.word:active{background:var(--fill)}
.ls{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.ls-h{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.ls-r{background:var(--fill);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ls-t{display:flex;gap:10px;align-items:flex-start}
.ls-t i{font-style:normal;flex:none;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin-top:1px}
.ls-t b{display:block;font-size:15.5px}.ls-t span{display:block;font-size:13px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.ls-r .il{justify-content:flex-start;padding:2px 0}.ls-r .ilw .ar{font-size:24px}
.ls-a{font-size:24px;line-height:1.8;text-align:right}
.ls-ru{font-size:13px;color:var(--ink-2);line-height:1.4}.ls-ru i{font-style:normal;color:var(--ink-3);font-size:11.5px}
.wx{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.lx-expl{font-size:14.5px;line-height:1.55;background:var(--fill);border-radius:12px;padding:12px 14px;color:var(--ink)}
.ar.ex{font-size:1.35em;line-height:1.4}
.hadith{margin:4px 0 0;padding:14px 16px;background:var(--fill);border-radius:14px}
.hadith blockquote{margin:0;font-size:14px;line-height:1.5;font-weight:500;color:var(--ink);text-wrap:pretty}
.hadith figcaption{margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.bh{display:flex;align-items:center;gap:10px;padding:6px 0 10px;width:100%;text-align:left}
.bh .t{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bh h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bh .hint{font-size:12px;color:var(--ink-3)}
.bh .cnt{font-size:12.5px;color:var(--ink-3);font-weight:600}
.bh .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .2s;flex:none}
.block.open .bh .chev{transform:rotate(180deg)}
.block.full .bh .cnt{color:var(--ink)}
.all{font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 0;margin:-4px 0 6px;display:block}
.all:active{color:var(--ink)}
.body{border-top:1px solid var(--line)}

.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;text-align:left;border-bottom:1px solid var(--line);min-height:54px}
.row .lab{flex:1;min-width:0}
.row .n{font-weight:500;font-size:15px}
.row .note{font-size:12px;color:var(--ink-3);margin-top:1px}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid #D4D4D4;flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:12px;height:12px;opacity:0;transition:opacity .15s}
.chk path{stroke:var(--on-ink)}
button.row[aria-pressed="true"] .chk{background:var(--on);border-color:var(--on)}
button.row[aria-pressed="true"] .chk svg{opacity:1}
button.row[aria-pressed="true"] .n{color:var(--ink-3)}

.row.tri{gap:2px}
.row.tri .lab{text-align:left;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.mark{width:44px;height:44px;margin:-5px 0;display:grid;place-items:center;flex:none;border-radius:50%}
.mark svg{width:28px;height:28px;padding:7px;border-radius:50%;border:1.5px solid #D4D4D4;box-sizing:border-box;transition:background .15s,border-color .15s}
.mark path{stroke:#C4C4C4;transition:stroke .15s}
.mark.yes[aria-pressed="true"] svg{background:var(--on);border-color:var(--on)}
.mark.yes[aria-pressed="true"] path{stroke:#fff}
.mark.no[aria-pressed="true"] svg{background:var(--miss);border-color:var(--miss)}
.mark.no[aria-pressed="true"] path{stroke:#fff}
.row.done .n{color:var(--ink-3)}
.pf{font-weight:700}
.row .go{font-size:20px;color:var(--ink-3);padding:0 10px}
.grp{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px;min-height:44px}
.grp .n{font-weight:500;font-size:15px}
.grp .cnt{font-size:12.5px;font-weight:600;color:var(--ink-3);padding-right:8px}
.row.sub{padding-left:16px;min-height:48px;padding-top:8px;padding-bottom:8px}
.row.sub .n{font-size:14px}
.row.miss .n{color:var(--miss)}
.dots i.x{background:#F3C9C4}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:500;color:var(--ink-2);border:1.5px solid var(--line)}
.step button:active{background:var(--fill)}
.step output{min-width:58px;text-align:center;font-weight:600}
.step output.ok{color:var(--ink)}
.multi{flex-direction:column;align-items:stretch;gap:10px}
.multi .head{display:flex;align-items:center;gap:12px}
.multi .head .cnt{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{padding:9px 2px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);text-align:center}
.chip[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--on-ink)}

/* stats */
.wk{margin:14px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em}
.tile .k{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.card{margin-top:26px}
.card h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-hd h3{margin:0}
.cal-nav{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--ink-2)}
.cal-nav:disabled{opacity:.25}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:10.5px;font-weight:600;color:var(--ink-3);text-align:center;padding-bottom:2px;letter-spacing:.04em}
.cal-d{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--h0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.cal-d b{font-size:13.5px;font-weight:600}
.cal-d small{font-size:9.5px;font-weight:600;opacity:.75;min-height:1em}
.cal-d.l1{background:var(--h1)}.cal-d.l2{background:var(--h2)}.cal-d.l3{background:var(--h3);color:#fff}.cal-d.l4{background:var(--h4);color:#fff}
.cal-d.fut{background:transparent;color:var(--ink-3)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-d.today.l3,.cal-d.today.l4{box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 3px #fff}
.cal-sum{font-size:12.5px;color:var(--ink-2);margin-top:12px}
.cal-sum b{color:var(--ink);font-weight:600}
.hl-group{margin-top:18px}
.hl-group:first-of-type{margin-top:0}
.hl-group h4{margin:0 0 6px;font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hl{display:grid;grid-template-columns:minmax(0,1fr) auto 40px 36px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.hl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.dots{display:flex;gap:2px}
.dots i{width:7px;height:14px;border-radius:2px;background:var(--h0)}
.dots i.p{background:var(--h2)}.dots i.d{background:var(--h4)}
.hl .pc,.hl .sk{text-align:right;font-weight:600}
.hl .sk{color:var(--ink-2)}
.hl-head{font-size:11px;color:var(--ink-3);border-top:0;padding-top:0}
.hl-head span{text-align:right}
.foot{font-size:11.5px;color:var(--ink-3);margin-top:22px;line-height:1.5}
button,textarea{touch-action:manipulation}
.dt h1{cursor:pointer}
.notes{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.qn{display:flex;flex-direction:column;gap:8px}
.qn textarea{font:inherit;font-size:16px;line-height:1.45;color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;resize:none;min-height:150px;background:var(--bg);overflow:hidden}
.qn textarea:focus{outline:none;border-color:var(--ink)}
.qn textarea::placeholder{color:var(--ink-3)}
.qn-save{align-self:flex-end;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff}
.qn-save:disabled{background:var(--fill);color:var(--ink-3)}
.nq{font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--line);padding:10px 2px;background:transparent;color:var(--ink);-webkit-appearance:none;border-radius:0}
.nq:focus{outline:none;border-color:var(--ink)}
.ntags{display:flex;flex-wrap:wrap;gap:6px}
.ntag{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-2)}
.ntag small{color:var(--ink-3);font-weight:500}
.ntag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ntag[aria-pressed="true"] small{color:#ccc}
.ngrp{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.ncard{padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.ncard.pin{background:var(--fill);border-color:var(--fill)}
.nt{white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.5;cursor:text}
.tag{color:var(--ink-2);font-weight:600}
.nmeta{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.nmeta span{flex:1}
.nmeta button{font-size:12px;font-weight:600;color:var(--ink-3)}
.nedit{width:100%;font:inherit;font-size:16px;line-height:1.5;border:0;resize:none;padding:0;background:transparent;color:var(--ink)}
.nedit:focus{outline:none}
.nempty{font-size:13.5px;color:var(--ink-3);padding:20px 0;text-align:center}
.daynotes .dn{display:flex;gap:10px;align-items:baseline;text-align:left;padding:10px 0;border-top:1px solid var(--line);width:100%}
.dn-t{flex:1;white-space:pre-wrap;font-size:14.5px;line-height:1.45}
.dn-m{font-size:11.5px;color:var(--ink-3)}
.daynotes .qn{margin-top:8px}
.daynotes .qn textarea{min-height:110px}
.note-block{display:flex;flex-direction:column;gap:8px}
.note-lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.note-block textarea{font:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;min-height:52px;background:var(--bg)}
.note-block textarea:focus{outline:none;border-color:var(--ink)}
.note-block textarea::placeholder{color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:18px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.18);white-space:nowrap}
.toast button{font-weight:700;color:#fff;text-decoration:underline;text-underline-offset:3px}
.dl{font-size:11px;font-weight:600;color:var(--ink-3);margin-top:4px}
.dl.up{color:#1E7F4F}.dl.down{color:var(--warn)}
.weak{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:500}
.weak .blk{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:4px}
.weak b{font-weight:600}
.pblock{display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;padding:6px 0 10px}

<div class="wrap">

<script>
(function(){
const CHECK='<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const MINUS='<svg viewBox="0 0 14 14"><path d="M3.5 7h7" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>';

const BLOCKS=[
 {id:'night',name:'Прошлая ночь',hint:'от Иша до Фаджра',items:[

const ALL=BLOCKS.flatMap(b=>b.items.map(h=>Object.assign({block:b.id},h)));
const TOTAL=ALL.length;

function score(h,raw){
  if(h.type==='hours') return raw?Math.min(raw/h.target,1):0;
  if(h.type==='multi') return Array.isArray(raw)?raw.length/h.opts.length:0;

function api(path,opts){

    .then(r=>{

      for(const k in all)if(!unsynced[k]&&!pending.has(k)&&!((pushedAt[k]||0)>t0))state[k]=all[k].v||{};

        st.append(minus,out,plus);r.appendChild(st);body.appendChild(r);
      }else if(h.type==='multi'){
        const arr=Array.isArray(v[h.id])?v[h.id]:[];
        const r=el('div',{class:'row multi'});
        r.appendChild(el('div',{class:'head'},`<div class="lab"><div class="n">${esc(h.n)}</div></div><span class="cnt num">${arr.length}/${h.opts.length}</span>`));
        const ch=el('div',{class:'chips'});
        for(const o of h.opts){
          const on=arr.includes(o);
          const c=el('button',{class:'chip','aria-pressed':String(on)},esc(o));
          c.onclick=()=>mutate(viewDate,v=>{let a=Array.isArray(v[h.id])?v[h.id].slice():[];a=on?a.filter(x=>x!==o):h.opts.filter(x=>x===o||a.includes(x));if(a.length)v[h.id]=a;else delete v[h.id];});
          ch.appendChild(c);
        }
        r.appendChild(ch);body.appendChild(r);
      }
    }
    root.appendChild(sec);
  }
  shownOpen=nowOpen;
  setTimeout(doRefocus,0);
  const dn=allNotes().filter(([,n])=>noteDay(n)===viewDate).sort((a,b)=>a[1].at<b[1].at?-1:1);
  const nb=el('section',{class:'pblock daynotes'});
  nb.appendChild(planHead('Заметки дня','мысли, идеи, что помешало',dn.length?String(dn.length):''));
  for(const [,n] of dn){
    const r=el('button',{class:'dn'},`<span class="dn-t">${noteHtml(n.t)}</span><span class="dn-m">${noteTimeTxt(n)}</span>`);
    r.onclick=()=>{switchTab('notes');};nb.appendChild(r);
  }
  nb.appendChild(quickNote('day-note-new','Записать мысль…',viewDate));
  root.appendChild(nb);
}

// ---------- заметки (вместо Google Keep). Хранятся по месяцу создания: ключ YYYY-MM, поле _notes [{id,t,at,up,pin}]
const isMonth=k=>/^\d{4}-\d{2}$/.test(k);
function allNotes(){const out=[];for(const k in state)if(isMonth(k))for(const n of state[k]._notes||[])out.push([k,n]);return out;}
function noteDay(n){return key(new Date(n.at));}
function noteTimeTxt(n){const d=new Date(n.at);return pad(d.getHours())+':'+pad(d.getMinutes());}
function tagsOf(t){return [...new Set((t.match(/#[\p{L}\d_]+/gu)||[]).map(x=>x.toLowerCase()))];}
function noteHtml(t){return esc(t).replace(/#[\p{L}\d_]+/gu,m=>`<span class="tag">${m}</span>`);}
function addNote(t,date){
  t=t.trim();if(!t)return;
  const at=(!date||date===today)?new Date():new Date(parse(date).setHours(12,0,0,0));
  const mk=key(at).slice(0,7);
  mutate(mk,v=>{(v._notes=v._notes||[]).unshift({id:uid(),t,at:at.toISOString()});});
}
function quickNote(id,ph,date){
  const box=el('div',{class:'qn'});
  const ta=el('textarea',{id,rows:'5',placeholder:ph});
  let draft='';try{draft=localStorage.getItem('fajr-witr-draft-'+id)||'';}catch(e){}
  ta.value=draft;
  const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight+3,420)+'px';};
  ta.oninput=()=>{grow();try{localStorage.setItem('fajr-witr-draft-'+id,ta.value);}catch(e){}btn.disabled=!ta.value.trim();};
  const btn=el('button',{class:'qn-save'},'Сохранить');btn.disabled=!draft.trim();
  const save=()=>{const t=ta.value;if(!t.trim())return;ta.value='';try{localStorage.removeItem('fajr-witr-draft-'+id);}catch(e){}refocus=id;addNote(t,date);toast('Заметка сохранена');};
  btn.onclick=save;
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();save();}};
  box.append(ta,btn);setTimeout(grow,0);
  return box;
}
function migrateNotes(){ // old single «Заметка дня» (_note) becomes a normal note, once, same id on every device
  for(const k of Object.keys(state)){
    const v=state[k];if(!isDay(k)||!v||!v._note)continue;
    const mk=k.slice(0,7),m=docOf(mk),id='n-'+k;
    m._notes=m._notes||[];
    if(!m._notes.some(n=>n.id===id))m._notes.push({id,t:v._note,at:new Date(parse(k).setHours(21,0,0,0)).toISOString()});
    delete v._note;unsynced[k]=true;unsynced[mk]=true;
  }
}
let noteQuery='',noteTag='',editing=null;
function renderNotes(){
  const root=$('view-notes');root.innerHTML='';
  root.appendChild(quickNote('note-new','Новая заметка… #тег',null));
  const q=el('input',{type:'search',id:'note-q',class:'nq',placeholder:'Поиск',value:''});q.value=noteQuery;
  q.oninput=()=>{noteQuery=q.value;renderNoteList();};
  root.appendChild(q);
  const tags={};for(const [,n] of allNotes())for(const t of tagsOf(n.t))tags[t]=(tags[t]||0)+1;
  const tk=Object.keys(tags).sort((a,b)=>tags[b]-tags[a]);
  if(tk.length){
    const ch=el('div',{class:'ntags'});
    for(const t of tk){const c=el('button',{class:'ntag','aria-pressed':String(noteTag===t)},`${esc(t)} <small>${tags[t]}</small>`);c.onclick=()=>{noteTag=noteTag===t?'':t;renderNotes();};ch.appendChild(c);}
    root.appendChild(ch);
  }
  root.appendChild(el('div',{id:'note-list'}));
  renderNoteList();
  doRefocus();
}
function renderNoteList(){
  const box=$('note-list');if(!box)return;box.innerHTML='';
  const q=noteQuery.trim().toLowerCase();
  let list=allNotes().filter(([,n])=>(!q||n.t.toLowerCase().includes(q))&&(!noteTag||tagsOf(n.t).includes(noteTag)));
  list.sort((a,b)=>(b[1].pin?1:0)-(a[1].pin?1:0)||(a[1].at<b[1].at?1:-1));
  if(!list.length){box.appendChild(el('div',{class:'nempty'},q||noteTag?'Ничего не найдено':'Здесь будут твои заметки. Пиши сверху, #теги помогут найти потом.'));return;}
  let lastLabel='';
  const f=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'});
  for(const [mk,n] of list){
    const d=noteDay(n);
    const label=n.pin?'Закреплённые':d===today?'Сегодня':d===addDays(today,-1)?'Вчера':f.format(parse(d));
    if(label!==lastLabel){box.appendChild(el('div',{class:'ngrp'},label));lastLabel=label;}
    const card=el('div',{class:'ncard'+(n.pin?' pin':'')});
    if(editing===n.id){
      const ta=el('textarea',{class:'nedit'});ta.value=n.t;
      const done=()=>{editing=null;const t=ta.value.trim();
        if(!t)mutate(mk,v=>{v._notes=(v._notes||[]).filter(x=>x.id!==n.id);markGone(v,n.id);});
        else if(t!==n.t)mutate(mk,v=>{const x=(v._notes||[]).find(x=>x.id===n.id);if(x){x.t=t;x.up=new Date().toISOString();}});
        else renderNoteList();};
      ta.onblur=done;card.appendChild(ta);box.appendChild(card);
      setTimeout(()=>{ta.style.height=ta.scrollHeight+'px';ta.focus();},0);
      continue;
    }
    const txt=el('div',{class:'nt'},noteHtml(n.t));
    txt.onclick=()=>{editing=n.id;renderNoteList();};
    const meta=el('div',{class:'nmeta'},`<span>${n.pin?f.format(parse(d))+' · ':''}${noteTimeTxt(n)}</span>`);
    const pin=el('button',null,n.pin?'Открепить':'Закрепить');
    pin.onclick=()=>mutate(mk,v=>{const x=(v._notes||[]).find(x=>x.id===n.id);if(x){x.pin=!x.pin;x.up=new Date().toISOString();}});
    const del=el('button',null,'Удалить');
    del.onclick=()=>{const before=(docOf(mk)._notes||[]).slice();mutate(mk,v=>{v._notes=(v._notes||[]).filter(x=>x.id!==n.id);markGone(v,n.id);});toast('Заметка удалена',()=>mutate(mk,v=>{v._notes=before;unGone(v,[n.id]);}));};
    meta.append(pin,del);
    card.append(txt,meta);box.appendChild(card);
  }
}

function toast(text,undo){
  const t=$('toast');clearTimeout(t._h);
  t.innerHTML='';t.appendChild(el('span',null,esc(text)));
  if(undo){const b=el('button',null,'Отменить');b.onclick=()=>{t.hidden=true;undo();};t.appendChild(b);}
  t.hidden=false;t._h=setTimeout(()=>{t.hidden=true;},5000);
}

function renderHeader(){
  const d=parse(viewDate);
  let t=fmtDay.format(d);t=t.charAt(0).toUpperCase()+t.slice(1);
  $('dtitle').textContent=viewDate===today?'Сегодня, '+t.split(', ').slice(1).join(', '):t;
  $('next').disabled=viewDate>=today;
  const s=dayScore(state[viewDate]);
  $('barfill').style.width=(s/TOTAL*100).toFixed(1)+'%';
  const sTxt=Number.isInteger(s)?s:s.toFixed(1).replace('.',',');
  $('progtxt').textContent=s>=TOTAL-1e-9?'Всё выполнено':`${sTxt} из ${TOTAL} · ${Math.round(s/TOTAL*100)}%`;
  const ps=planStats(state[viewDate]);
  $('planfill').style.width=(ps.n?ps.done/ps.n*100:0).toFixed(1)+'%';
  $('plantxt').textContent=!ps.n?'не заполнен':ps.done===ps.n?'Всё выполнено':`${ps.done} из ${ps.n}`;
}
function planStats(v){ // what was planned for the day: focus, tasks (not moved on), small joys
  v=v||{};const items=[];
  if(v._focus&&(v._focus.t||'').trim())items.push(!!v._focus.done);
  for(const x of v._tasks||[])if(!x.moved)items.push(!!x.done);
  for(const x of v._fun||[])items.push(!!x.done);
  return {n:items.length,done:items.filter(Boolean).length};
}

// ---------- stats
function firstDate(){const ks=Object.keys(state).filter(k=>isDay(k)&&hasMarks(state[k])).sort();return ks[0]||today;}
function streak(h){
  let d=today,n=0;
  if(sc(h,state[d])<1)d=addDays(d,-1);
  while(sc(h,state[d])>=1){n++;d=addDays(d,-1);}
  return n;
}
function pctWindow(h,days){
  const start=firstDate();let done=0,cnt=0;
  for(let i=0;i<days;i++){const d=addDays(today,-i);if(d<start)break;cnt++;done+=sc(h,state[d]);}
  return cnt?Math.round(done/cnt*100):0;
}
function avgPrev(fn){ // days 8..14 back; null when the log is younger than that
  const start=firstDate();if(addDays(today,-7)<start)return null;
  let s=0,c=0;for(let i=7;i<14;i++){const d=addDays(today,-i);if(d<start)break;c++;s+=fn(state[d]||{});}return c?s/c:null;
}
function avg(fn,days){const start=firstDate();let s=0,c=0;for(let i=0;i<days;i++){const d=addDays(today,-i);if(d<start)break;c++;s+=fn(state[d]||{});}return c?s/c:0;}
const fmt1=n=>n.toFixed(1).replace('.',',');

function renderStats(){
  const root=$('view-stats');root.innerHTML='';
  const dayPct=avg(v=>dayScore(v)/TOTAL,7)*100, dayPrev=(p=>p===null?null:p*100)(avgPrev(v=>dayScore(v)/TOTAL));
  const work=avg(v=>+v.work||0,7), workPrev=avgPrev(v=>+v.work||0);
  const jam=avg(v=>Array.isArray(v.jamaat)?v.jamaat.length:0,7), jamPrev=avgPrev(v=>Array.isArray(v.jamaat)?v.jamaat.length:0);
  const delta=(a,b,f,unit)=>{if(b===null)return '';const d=a-b;if(Math.abs(d)<0.05)return '<div class="dl">как на прошлой</div>';return `<div class="dl ${d>0?'up':'down'}">${d>0?'+':'−'}${f(Math.abs(d))}${unit} к прошлой</div>`;};
  root.appendChild(el('h3',{class:'wk'},'Последние 7 дней'));
  const tiles=el('div',{class:'tiles'});
  tiles.innerHTML=`<div class="tile"><div class="v num">${Math.round(dayPct)}%</div><div class="k">день в среднем</div>${delta(dayPct,dayPrev,x=>Math.round(x),' п.')}</div>
  <div class="tile"><div class="v num">${fmt1(work)} ч</div><div class="k">работа в день</div>${delta(work,workPrev,fmt1,' ч')}</div>
  <div class="tile"><div class="v num">${fmt1(jam)}/4</div><div class="k">джамаат в день</div>${delta(jam,jamPrev,fmt1,'')}</div>`;
  root.appendChild(tiles);

  // weak spots: lowest completion over the last 14 days
  const tracked=Object.keys(state).filter(k=>isDay(k)&&k>=addDays(today,-13)&&hasMarks(state[k])).length;
  if(tracked>=3){
    const weak=ALL.map(h=>({h,p:pctWindow(h,14)})).filter(x=>x.p<80).sort((a,b)=>a.p-b.p).slice(0,3);
    const w=el('div',{class:'card'},'<h3>Слабые места · 14 дней</h3>');
    if(weak.length)for(const x of weak)w.appendChild(el('div',{class:'weak'},`<span>${esc(x.h.n)} <span class="blk">${esc(BLOCKS.find(b=>b.id===x.h.block).name.toLowerCase())}</span></span><b class="num">${x.p}%</b>`));
    else w.appendChild(el('div',{class:'weak'},'<span>Всё выше 80% — держится</span>'));
    root.appendChild(w);
  }

  // heatmap: 15 weeks, Mon-first columns
  // month calendar: every day with its number and result
  const [cy,cm]=calMonth.split('-').map(Number);
  const first=new Date(cy,cm-1,1),dim=new Date(cy,cm,0).getDate();
  const card=el('div',{class:'card cal'});
  const mname=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).replace(' г.','');
  const hd=el('div',{class:'cal-hd'});
  const pv=el('button',{class:'cal-nav','aria-label':'Предыдущий месяц'},'‹');
  const nx=el('button',{class:'cal-nav','aria-label':'Следующий месяц'},'›');
  const thisMonth=today.slice(0,7);
  nx.disabled=calMonth>=thisMonth;
  pv.onclick=()=>{calMonth=key(new Date(cy,cm-2,1)).slice(0,7);renderStats();};
  nx.onclick=()=>{if(calMonth<thisMonth){calMonth=key(new Date(cy,cm,1)).slice(0,7);renderStats();}};
  hd.append(pv,el('h3',null,mname.charAt(0).toUpperCase()+mname.slice(1)),nx);
  card.appendChild(hd);
  const g=el('div',{class:'cal-grid'});
  for(const w of ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'])g.appendChild(el('span',{class:'cal-wd'},w));
  for(let i=0;i<(first.getDay()+6)%7;i++)g.appendChild(el('span'));
  let sum=0,cnt=0,good=0;
  for(let day=1;day<=dim;day++){
    const d=calMonth+'-'+pad(day);
    const v=state[d];const has=hasMarks(v);
    const p=has?Math.round(dayScore(v)/TOTAL*100):null;
    if(p!==null){sum+=p;cnt++;if(p>=90)good++;}
    const lv=p===null?'':p>=90?'l4':p>=70?'l3':p>=40?'l2':'l1';
    const c=el('button',{class:'cal-d '+lv+(d===today?' today':'')+(d>today?' fut':'')},`<b>${day}</b><small>${p===null?'':p+'%'}</small>`);
    if(d>today)c.disabled=true;else c.onclick=()=>{viewDate=d;switchTab('day');};
    g.appendChild(c);
  }
  card.appendChild(g);
  card.appendChild(el('div',{class:'cal-sum'},cnt?`Отмечено дней: <b>${cnt}</b> · средний <b>${Math.round(sum/cnt)}%</b> · сильных (90%+) <b>${good}</b>`:'В этом месяце отметок нет'));
  root.appendChild(card);

  // per habit
  const list=el('div',{class:'card'},'<h3>По привычкам</h3>');
  for(const b of BLOCKS){
    const g=el('div',{class:'hl-group'},`<h4>${esc(b.name)}</h4>`);
    g.appendChild(el('div',{class:'hl hl-head'},'<span style="text-align:left"></span><span>14 дней</span><span>30д</span><span>серия</span>'));
    for(const h of b.items){
      let dots='';
      for(let i=13;i>=0;i--){const d=addDays(today,-i);const s=sc(h,state[d]);dots+=`<i class="${s>=1?'d':s>0?'p':missed(h,state[d])?'x':''}"></i>`;}
      g.appendChild(el('div',{class:'hl'},`<span class="nm">${esc(h.n)}${h.note&&/раз|стр|мин/.test(h.note)?' <span style="color:var(--ink-3)">'+esc(h.note.replace(' раз',''))+'</span>':''}</span><span class="dots">${dots}</span><span class="pc num">${pctWindow(h,30)}%</span><span class="sk num">${streak(h)}</span>`));
    }
    list.appendChild(g);
  }
  root.appendChild(list);
  root.appendChild(el('div',{class:'foot'},'Серия — сколько дней подряд выполнено, считая сегодня или вчера. Проценты — с первого дня отметок. Свайп влево-вправо на экране дня листает дни, тап по дате — вернуться к сегодня.'));
}

let tab='day';
let calMonth=key(new Date()).slice(0,7);
function switchTab(t){
  tab=t;
  for(const x of ['day','plan','notes','learn','sura','stats']){$('tab-'+x).setAttribute('aria-selected',String(t===x));$('view-'+x).hidden=t!==x;}
  const flat=t==='stats'||t==='notes'||t==='learn'||t==='sura';
  $('datebar').hidden=flat;$('progrow').hidden=t!=='day';$('planrow').hidden=flat;
  const tb=$('tab-'+t);if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:'nearest',inline:'nearest'});
  try{localStorage.setItem('fajr-witr-tab',t);}catch(e){}
  render();window.scrollTo(0,0);
}
function render(){renderHeader();if(tab==='day')renderDay();else if(tab==='plan')renderPlan();else if(tab==='notes')renderNotes();else if(tab==='learn')renderLearn();else if(tab==='sura')renderSura();else renderStats();growAll();}
addEventListener('resize',()=>growAll());

function go(n){const d=addDays(viewDate,n);if(d>today)return;viewDate=d;render();}
$('prev').onclick=()=>go(-1);
$('dtitle').onclick=()=>{if(viewDate!==today){viewDate=today;render();}};
let tx=0,ty=0,tt=0;
$('view-day').addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();},{passive:true});
$('view-day').addEventListener('touchend',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Date.now()-tt<600&&Math.abs(dx)>70&&Math.abs(dy)<40)go(dx>0?-1:1);
},{passive:true});
$('next').onclick=()=>go(1);
$('tab-day').onclick=()=>switchTab('day');
$('tab-stats').onclick=()=>switchTab('stats');
$('tab-plan').onclick=()=>switchTab('plan');
$('tab-learn').onclick=()=>switchTab('learn');
$('tab-sura').onclick=()=>switchTab('sura');
$('tab-notes').onclick=()=>{switchTab('notes');const c=$('note-new');if(c)c.focus();};
$('planrow').onclick=()=>{if(tab!=='plan')switchTab('plan');};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'){lsSave();return;}
  const now=key(new Date());
  if(now!==today){if(viewDate===today)viewDate=now;today=now;render();}
  pull(); // pick up marks made on the other device
});

try{const t=localStorage.getItem('fajr-witr-tab');if(['stats','plan','notes','learn','sura'].includes(t))tab=t;}catch(e){}
if(location.hash==='#notes')tab='notes';
lsLoad();
switchTab(tab);
setStatus('Загружаю…');pull();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
